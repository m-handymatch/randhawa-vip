# Loads local businesses (Overture Maps Places) into the site's database.
# - Every 6 hours: loads the areas queued for members (home ZIP + nearby cities).
# - By hand: Run workflow, optionally with a bounding box + one-time token.
# Nothing is committed to this public repo.
name: Extract local businesses
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      bbox:
        description: "Optional: west,south,east,north (needs a token). Empty = work the member queue"
        required: false
        default: ""
      token:
        description: "One-time import token (only with a bounding box)"
        required: false
        default: ""
permissions:
  contents: read
  id-token: write
concurrency:
  group: businesses
  cancel-in-progress: false
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install overturemaps duckdb
      - name: Load queued member areas
        if: ${{ github.event_name == 'schedule' || inputs.bbox == '' }}
        env:
          AREAS: "3"
        run: python scripts/business_queue.py
      - name: Extract a bounding box
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bbox != '' }}
        env:
          BBOX: ${{ inputs.bbox }}
        run: python scripts/businesses.py
      - name: Send it with the one-time token
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bbox != '' && inputs.token != '' }}
        env:
          TOKEN: ${{ inputs.token }}
        run: |
          echo "::add-mask::$TOKEN"
          gzip -kf businesses.csv
          curl -sS --fail-with-body -X POST \
            -H "x-import-token: $TOKEN" -H "content-type: application/gzip" \
            --data-binary @businesses.csv.gz \
            https://pipzvzxcfvsxyiwmqpyv.supabase.co/functions/v1/businesses-import
