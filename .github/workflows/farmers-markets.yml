# Refreshes public/data/farmers-markets/*.json from the USDA farmers market directory.
# Runs weekly; markets update their listings through the season.
name: Refresh farmers markets
on:
  schedule:
    - cron: "41 10 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl && python scripts/farmers_markets.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain public/data/farmers-markets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/farmers-markets
            git commit -m "Refresh farmers markets from USDA"
            git push
          else
            echo "No changes"
          fi
